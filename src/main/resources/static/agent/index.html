<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent 工程实验室</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #1f2329; height: 100vh; }
        .wrap { display: flex; height: 100vh; }
        .side { width: 220px; background: #fff; border-right: 1px solid #e5e6eb; padding: 16px; overflow-y: auto; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .panel { width: 320px; background: #fff; border-left: 1px solid #e5e6eb; padding: 16px; overflow-y: auto; }
        h1 { font-size: 16px; margin-bottom: 12px; }
        h2 { font-size: 13px; color: #86909c; margin: 16px 0 8px; }
        button { border: 1px solid #d9d9d9; background: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
        button:hover { border-color: #4c8bf5; color: #4c8bf5; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .primary { background: #4c8bf5; border-color: #4c8bf5; color: #fff; }
        .primary:hover { background: #3a75d8; color: #fff; }
        .chat { flex: 1; overflow-y: auto; padding: 24px; }
        .msg { max-width: 760px; margin: 0 auto 16px; }
        .role { font-size: 12px; color: #86909c; margin-bottom: 4px; }
        .bubble { background: #fff; border: 1px solid #e5e6eb; border-radius: 8px; padding: 10px 14px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
        .msg.user .bubble { background: #e8f0ff; border-color: #cddcff; }
        .msg.tool .bubble { background: #f7f8fa; font-family: Menlo, Consolas, monospace; font-size: 12px; color: #4e5969; }
        .composer { border-top: 1px solid #e5e6eb; background: #fff; padding: 12px 24px; display: flex; gap: 8px; }
        textarea { flex: 1; height: 64px; resize: none; border: 1px solid #d9d9d9; border-radius: 6px; padding: 8px 12px; font-size: 14px; font-family: inherit; }
        .stat { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed #f0f0f0; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #f0f0f0; color: #4e5969; }
        .badge.ok { background: #e8fff0; color: #23a55a; }
        .badge.warn { background: #fff7e8; color: #d98a00; }
        .badge.err { background: #ffece8; color: #d9534f; }
        .tool-item { border: 1px solid #e5e6eb; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; font-size: 12px; }
        .tool-item b { font-family: Menlo, Consolas, monospace; }
        .muted { color: #86909c; font-size: 12px; }
        .session-item { padding: 8px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 4px; }
        .session-item.active { background: #e8f0ff; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="side">
        <h1>Agent 工程实验室</h1>
        <button class="primary" style="width:100%" onclick="newSession()">新建会话</button>
        <h2>会话</h2>
        <div id="sessions"><div class="muted">加载中…</div></div>
        <h2>当前会话</h2>
        <div class="muted" id="currentSession">未选择</div>
    </div>

    <div class="main">
        <div class="chat" id="chat"></div>
        <div class="composer">
            <textarea id="input" placeholder="输入一句话，回车发送（Shift+回车换行）。试试：现在几点了"></textarea>
            <div style="display:flex;flex-direction:column;gap:8px;">
                <button class="primary" id="sendBtn" onclick="send()">发送</button>
                <button id="stopBtn" onclick="stopRun()" disabled>停止</button>
            </div>
        </div>
    </div>

    <div class="panel">
        <h2>对照实验</h2>
        <div style="display:flex; gap:8px; margin-bottom:8px;">
            <select id="labKey" style="flex:1; border:1px solid #d9d9d9; border-radius:6px; padding:6px;"></select>
            <button id="labBtn" onclick="runLab()">跑</button>
        </div>
        <div id="labDesc" class="muted" style="margin-bottom:8px;"></div>
        <div id="labResult"><div class="muted">选一个实验开跑，两种模式的数字会并排列出来</div></div>

        <h2>工具清单</h2>
        <div id="tools"><div class="muted">加载中…</div></div>
        <h2>本次运行</h2>
        <div id="stats"><div class="muted">尚未运行</div></div>
        <h2>工具轨迹</h2>
        <div id="trace"><div class="muted">暂无</div></div>
    </div>
</div>

<script>
let sessionNo = '';
let runNo = '';
let reading = false;
let warned = false;

/**
 * 只在对话区提示一次模块不可用，避免每次加载都刷一条。
 */
function warnOnce(text) {
    if (warned) return;
    warned = true;
    addMessage('tool', text);
}

const chat = document.getElementById('chat');
const input = document.getElementById('input');

/**
 * EventSource 只支持 GET，而全站业务接口一律 POST，
 * 因此这里用 fetch + ReadableStream 自己解析 SSE。
 */
async function stream(request) {
    const response = await fetch('/api/agent/runs/stream', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(request)
    });
    const contentType = response.headers.get('Content-Type') || '';
    if (!contentType.includes('text/event-stream')) {
        // 模块没启用、参数不合法、并发超限时，返回的是统一响应 JSON 而不是事件流。
        // 不判断这一条的话，页面只会静默闪一下，用户完全不知道发生了什么
        const text = await response.text();
        let message = 'HTTP ' + response.status;
        try {
            const body = JSON.parse(text);
            message = body.message || message;
        } catch (e) {
            // 不是 JSON 就退回状态码
        }
        throw new Error(message);
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream: true});
        let index;
        // 缓冲区里可能同时到了多个事件，也可能只到了半个
        while ((index = buffer.indexOf('\n\n')) >= 0) {
            handleEvent(buffer.slice(0, index));
            buffer = buffer.slice(index + 2);
        }
    }
}

function handleEvent(raw) {
    let name = 'message';
    let payload = '';
    for (const line of raw.split('\n')) {
        if (line.startsWith('event:')) name = line.slice(6).trim();
        else if (line.startsWith('data:')) payload += line.slice(5).trim();
    }
    let data = payload;
    try { data = JSON.parse(payload); } catch (e) { /* 文本片段保持原样 */ }
    onEvent(name, data);
}

function onEvent(name, data) {
    if (name === 'run.start') {
        runNo = data.runNo;
        document.getElementById('stopBtn').disabled = false;
        setStats({状态: '运行中', 可用工具: data.toolCount});
        document.getElementById('trace').innerHTML = '';
    } else if (name === 'message.delta') {
        appendDelta(data);
    } else if (name === 'assistant.message') {
        addMessage('assistant', data.content);
    } else if (name === 'tool.call') {
        addToolTrace('调用', data.toolName, data.arguments, true);
    } else if (name === 'tool.result') {
        addToolTrace(data.success ? '成功' : '失败', data.toolName,
            data.success ? data.payload : data.errorMessage, data.success);
        addMessage('tool', (data.success ? data.payload : data.errorMessage) + '（' + data.elapsedMillis + 'ms）');
    } else if (name === 'run.finish') {
        document.getElementById('stopBtn').disabled = true;
        setStats({
            结束原因: data.finishReason + '（' + data.finishLabel + '）',
            步数: data.steps,
            工具调用: data.toolCalls,
            '提示 token': data.promptTokens,
            '生成 token': data.completionTokens,
            耗时: data.elapsedMillis + 'ms'
        });
    } else if (name === 'error') {
        addMessage('tool', '运行出错：' + data.message);
        document.getElementById('stopBtn').disabled = true;
    }
}

function send() {
    const prompt = input.value.trim();
    if (!prompt || reading) return;
    input.value = '';
    addMessage('user', prompt);
    reading = true;
    document.getElementById('sendBtn').disabled = true;
    stream({sessionNo: sessionNo || null, prompt: prompt, clientToken: 'web-' + Date.now()})
        .catch(e => {
            addMessage('tool', '运行失败：' + e.message
                + '（若提示 middleware is disabled，需要用 --dong.agent.enabled=true 启动应用）');
            setStats({状态: '失败', 原因: e.message});
        })
        .finally(() => {
            reading = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            loadSessions();
        });
}

async function stopRun() {
    if (!runNo) return;
    await fetch('/api/agent/runs/' + runNo + '/cancel', {method: 'POST'});
}

function addMessage(role, content) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = '<div class="role">' + (role === 'user' ? '我' : role === 'tool' ? '工具结果' : 'Agent') + '</div>'
        + '<div class="bubble"></div>';
    div.querySelector('.bubble').textContent = content;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div.querySelector('.bubble');
}

let streamingBubble = null;
function appendDelta(delta) {
    if (!streamingBubble) {
        const div = document.createElement('div');
        div.className = 'msg assistant';
        div.innerHTML = '<div class="role">Agent</div><div class="bubble"></div>';
        chat.appendChild(div);
        streamingBubble = div.querySelector('.bubble');
    }
    streamingBubble.textContent += delta;
    chat.scrollTop = chat.scrollHeight;
    // 下一轮回答开始时重新起一段
    if (delta.endsWith('。') || delta.endsWith('\n')) streamingBubble = null;
}

function addToolTrace(kind, toolName, detail, success) {
    const box = document.getElementById('trace');
    if (box.querySelector('.muted')) box.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'tool-item';
    div.innerHTML = '<span class="badge ' + (success ? 'ok' : 'err') + '">' + kind + '</span> '
        + '<b>' + toolName + '</b><div class="muted" style="margin-top:4px"></div>';
    div.querySelector('.muted').textContent = detail || '';
    box.appendChild(div);
}

function setStats(map) {
    const box = document.getElementById('stats');
    box.innerHTML = '';
    for (const key of Object.keys(map)) {
        const row = document.createElement('div');
        row.className = 'stat';
        row.innerHTML = '<span class="muted">' + key + '</span><span></span>';
        row.querySelector('span:last-child').textContent = map[key];
        box.appendChild(row);
    }
}

async function loadExperiments() {
    const res = await fetch('/api/agent/lab/experiments', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
    const body = await res.json();
    if (body.code !== 0) return;
    const select = document.getElementById('labKey');
    select.innerHTML = '';
    for (const key of body.data) {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = key;
        select.appendChild(option);
    }
}

async function runLab() {
    const key = document.getElementById('labKey').value;
    const btn = document.getElementById('labBtn');
    const box = document.getElementById('labResult');
    if (!key) return;
    btn.disabled = true;
    box.innerHTML = '<div class="muted">跑中…</div>';
    try {
        const res = await fetch('/api/agent/lab/' + key, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({rounds: 1})
        });
        const body = await res.json();
        if (body.code !== 0) {
            box.innerHTML = '<div class="muted">' + body.message + '</div>';
            return;
        }
        document.getElementById('labDesc').textContent = body.data.title + ' — ' + body.data.metrics;
        box.innerHTML = '';
        for (const item of body.data.items) {
            const div = document.createElement('div');
            div.className = 'tool-item';
            div.innerHTML = '<div><b>' + item.mode + '</b> '
                + '<span class="badge ' + (item.success ? 'ok' : 'warn') + '">' + (item.finishReason || '-') + '</span></div>'
                + '<div class="muted" style="margin-top:4px"></div>';
            div.querySelector('.muted').textContent = '步数 ' + item.steps
                + ' · 工具 ' + item.toolCalls
                + ' · 提示token ' + item.promptTokens
                + ' · 耗时 ' + item.elapsedMillis + 'ms'
                + ' · ' + item.detail;
            box.appendChild(div);
        }
    } finally {
        btn.disabled = false;
    }
}

async function loadTools() {
    const res = await fetch('/api/agent/tools', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
    const body = await res.json();
    const box = document.getElementById('tools');
    box.innerHTML = '';
    if (body.code !== 0) {
        box.innerHTML = '<div class="muted">' + body.message + '</div>';
        // 打开页面就说清楚为什么发消息没反应，而不是等用户点完发送去猜
        warnOnce('Agent 模块未启用：' + body.message + '。用 --dong.agent.enabled=true 启动后即可使用。');
        return;
    }
    for (const tool of body.data) {
        const div = document.createElement('div');
        div.className = 'tool-item';
        div.innerHTML = '<b>' + tool.name + '</b> '
            + '<span class="badge ' + (tool.needConfirm ? 'warn' : '') + '">' + tool.risk + '</span>'
            + '<div class="muted" style="margin-top:4px"></div>';
        div.querySelector('.muted').textContent = tool.description;
        box.appendChild(div);
    }
}

async function loadSessions() {
    const res = await fetch('/api/agent/sessions/list', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({pageNum: 1, pageSize: 20})
    });
    const body = await res.json();
    const box = document.getElementById('sessions');
    box.innerHTML = '';
    if (body.code !== 0) {
        box.innerHTML = '<div class="muted">' + body.message + '</div>';
        return;
    }
    for (const item of body.data.list) {
        const div = document.createElement('div');
        div.className = 'session-item' + (item.sessionNo === sessionNo ? ' active' : '');
        div.textContent = item.title || item.sessionNo;
        div.onclick = () => selectSession(item.sessionNo);
        box.appendChild(div);
    }
}

function selectSession(no) {
    sessionNo = no;
    document.getElementById('currentSession').textContent = no;
    chat.innerHTML = '';
    loadSessions();
}

function newSession() {
    sessionNo = '';
    chat.innerHTML = '';
    document.getElementById('currentSession').textContent = '下一句话将自动创建';
}

input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
    }
});

loadTools();
loadSessions();
loadExperiments();
</script>
</body>
</html>
