server:
  port: 8090
  shutdown: graceful

spring:
  datasource:
    url: jdbc:mysql://YOUR_PUBLIC_HOST:3306/dong_lab?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: CHANGE_ME
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: dong-lab-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: YOUR_PUBLIC_HOST
      port: 6379
      password: CHANGE_ME
      database: 0
      connect-timeout: 5s
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s
    mongodb:
      uri: mongodb://dong:CHANGE_ME@YOUR_PUBLIC_HOST:27017/dong_lab?authSource=admin

  elasticsearch:
    uris: YOUR_PUBLIC_HOST:9200
    username: elastic
    password: CHANGE_ME

  kafka:
    bootstrap-servers: YOUR_PUBLIC_HOST:9092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: dong-lab-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    listener:
      ack-mode: manual

rocketmq:
  name-server: YOUR_PUBLIC_HOST:9876
  producer:
    group: dong-lab-producer
    send-message-timeout: 5000

lab:
  redisson:
    address: redis://YOUR_PUBLIC_HOST:6379
    password: CHANGE_ME
    database: 0

  mq:
    active: rocketmq

  elasticsearch:
    enabled: true
    index-prefix: dong_lab

  mongodb:
    enabled: true

  rocketmq:
    enabled: true

  kafka:
    enabled: false

  mariadb:
    enabled: true
    url: jdbc:mariadb://YOUR_PUBLIC_HOST:3307/dong_lab_replica?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: CHANGE_ME
    driver-class-name: org.mariadb.jdbc.Driver

logging:
  level:
    root: info
    com.dong.lab: info
