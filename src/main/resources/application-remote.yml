spring:
  datasource:
    url: jdbc:mysql://${LAB_PUBLIC_HOST}:3306/dong_lab?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${LAB_MYSQL_USERNAME}
    password: ${LAB_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${LAB_PUBLIC_HOST}
      password: ${LAB_REDIS_PASSWORD}
    mongodb:
      uri: mongodb://${LAB_MONGO_USERNAME}:${LAB_MONGO_PASSWORD}@${LAB_PUBLIC_HOST}:27017/dong_lab?authSource=admin

  elasticsearch:
    uris: ${LAB_PUBLIC_HOST}:9200
    username: elastic
    password: ${LAB_ES_PASSWORD}

  kafka:
    bootstrap-servers: ${LAB_PUBLIC_HOST}:9092

rocketmq:
  name-server: ${LAB_PUBLIC_HOST}:9876

lab:
  redisson:
    address: redis://${LAB_PUBLIC_HOST}:6379
    password: ${LAB_REDIS_PASSWORD}

  mq:
    active: rocketmq

  elasticsearch:
    enabled: true

  mongodb:
    enabled: true

  rocketmq:
    enabled: true

  kafka:
    enabled: false

  mariadb:
    enabled: true
    url: jdbc:mariadb://${LAB_PUBLIC_HOST}:3307/dong_lab_replica?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${LAB_MARIADB_USERNAME}
    password: ${LAB_MARIADB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
