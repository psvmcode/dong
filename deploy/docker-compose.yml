services:
  mysql:
    image: mysql:8.0
    container_name: lab-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${LAB_MYSQL_PASSWORD:?set LAB_MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: dong_lab
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max_connections=60
      - --innodb_buffer_pool_size=64M
      - --innodb_log_buffer_size=4M
      - --key_buffer_size=8M
      - --tmp_table_size=8M
      - --max_heap_table_size=8M
      - --table_open_cache=200
      - --performance_schema=OFF
      - --skip-innodb-adaptive-hash-index
    volumes:
      - mysql-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${LAB_MYSQL_PASSWORD:?set LAB_MYSQL_PASSWORD in .env}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 320m
    profiles: ["core", "full"]

  redis:
    image: redis:7.2-alpine
    container_name: lab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${LAB_REDIS_PASSWORD:?set LAB_REDIS_PASSWORD in .env}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
      --maxclients 200
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LAB_REDIS_PASSWORD:?set LAB_REDIS_PASSWORD in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    profiles: ["core", "full"]

  mariadb:
    image: mariadb:10.11
    container_name: lab-mariadb
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${LAB_MARIADB_PASSWORD:?set LAB_MARIADB_PASSWORD in .env}
      MARIADB_DATABASE: dong_lab_replica
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --max_connections=60
      - --innodb_buffer_pool_size=48M
      - --key_buffer_size=8M
      - --aria_pagecache_buffer_size=8M
      - --performance_schema=OFF
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./initdb-replica:/docker-entrypoint-initdb.d:ro
    mem_limit: 256m
    profiles: ["replica", "full"]

  kafka:
    image: bitnami/kafka:3.7
    container_name: lab-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://${LAB_PUBLIC_HOST:?set LAB_PUBLIC_HOST in .env}:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@127.0.0.1:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xmx384M -Xms192M
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    mem_limit: 512m
    profiles: ["kafka", "full"]

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    container_name: lab-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: -Xms128m -Xmx128m -Xmn64m -XX:MaxDirectMemorySize=64m
    mem_limit: 220m
    profiles: ["mq", "full"]

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: lab-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10911:10911"
      - "10909:10909"
    # 渲染结果写 /tmp 而不是 conf 目录：镜像里没有 conf 目录，
    # 且容器以 uid 3000 运行，往安装目录写会 Permission denied
    command: >
      sh -c "envsubst < /home/rocketmq/conf/broker.conf.template > /tmp/broker.conf
      && sh mqbroker -n rocketmq-namesrv:9876 -c /tmp/broker.conf"
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m -XX:MaxDirectMemorySize=96m
      LAB_PUBLIC_HOST: ${LAB_PUBLIC_HOST:?set LAB_PUBLIC_HOST in .env}
    volumes:
      - ./data/rocketmq:/home/rocketmq/store
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf.template:ro
    mem_limit: 420m
    profiles: ["mq", "full"]

  elasticsearch:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    image: lab-elasticsearch-ik:8.15.3
    container_name: lab-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m -XX:MaxDirectMemorySize=192m
      ELASTIC_PASSWORD: ${LAB_ES_PASSWORD:?set LAB_ES_PASSWORD in .env}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 800m
    profiles: ["search", "full"]

  mongodb:
    image: mongo:7.0
    container_name: lab-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${LAB_MONGO_USERNAME:?set LAB_MONGO_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${LAB_MONGO_PASSWORD:?set LAB_MONGO_PASSWORD in .env}
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    mem_limit: 400m
    profiles: ["doc", "full"]

volumes:
  mysql-data:
  redis-data:
  mariadb-data:
  kafka-data:
  es-data:
  mongo-data:
