services:
  mysql:
    image: mysql:8.0
    container_name: lab-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${LAB_MYSQL_PASSWORD:?set LAB_MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: dong_lab
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max_connections=200
      - --innodb_buffer_pool_size=128M
      - --performance_schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${LAB_MYSQL_PASSWORD:?set LAB_MYSQL_PASSWORD in .env}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    profiles: ["core", "full"]

  redis:
    image: redis:7.2-alpine
    container_name: lab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${LAB_REDIS_PASSWORD:?set LAB_REDIS_PASSWORD in .env}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LAB_REDIS_PASSWORD:?set LAB_REDIS_PASSWORD in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 320m
    profiles: ["core", "full"]

  mariadb:
    image: mariadb:10.11
    container_name: lab-mariadb
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${LAB_MARIADB_PASSWORD:?set LAB_MARIADB_PASSWORD in .env}
      MARIADB_DATABASE: dong_lab_replica
      TZ: Asia/Shanghai
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./initdb-replica:/docker-entrypoint-initdb.d:ro
    mem_limit: 384m
    profiles: ["replica", "full"]

  kafka:
    image: bitnami/kafka:3.7
    container_name: lab-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://${LAB_PUBLIC_HOST:?set LAB_PUBLIC_HOST in .env}:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@127.0.0.1:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xmx512M -Xms256M
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    profiles: ["kafka", "full"]

  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    container_name: lab-rocketmq-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m
    profiles: ["mq", "full"]

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    container_name: lab-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    ports:
      - "10911:10911"
      - "10909:10909"
    command: >
      sh -c "envsubst < /home/rocketmq/conf/broker.conf.template > /home/rocketmq/conf/broker.conf
      && sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf"
    environment:
      JAVA_OPT_EXT: -Xms384m -Xmx384m -Xmn192m
      LAB_PUBLIC_HOST: ${LAB_PUBLIC_HOST:?set LAB_PUBLIC_HOST in .env}
    volumes:
      - ./data/rocketmq:/home/rocketmq/store
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf.template:ro
    profiles: ["mq", "full"]

  elasticsearch:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    image: lab-elasticsearch-ik:8.15.3
    container_name: lab-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: ${LAB_ES_PASSWORD:?set LAB_ES_PASSWORD in .env}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 900m
    profiles: ["search", "full"]

  mongodb:
    image: mongo:7.0
    container_name: lab-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${LAB_MONGO_USERNAME:?set LAB_MONGO_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${LAB_MONGO_PASSWORD:?set LAB_MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    mem_limit: 512m
    profiles: ["doc", "full"]

volumes:
  mysql-data:
  redis-data:
  mariadb-data:
  kafka-data:
  es-data:
  mongo-data:
